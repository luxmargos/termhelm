name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Self-test PowerShell Core Windows controller
        if: runner.os == 'Windows'
        shell: cmd
        run: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native\windows\termhelm-controller.ps1 -SelfTest

      - name: Self-test Windows PowerShell 5.1 controller
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native\windows\termhelm-controller.ps1 -SelfTest

      - name: Test
        run: pnpm test

      - name: Test public API types
        run: pnpm run test:types

      - name: Build TypeScript
        run: pnpm run build

  package:
    name: Validate npm package
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required package files
        run: pnpm run verify:windows-helpers

      - name: Pack
        run: |
          mkdir -p package-output
          pnpm pack --pack-destination package-output

      - name: Verify packed PowerShell controller path
        shell: bash
        run: |
          package_path="$(find package-output -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_path"
          tar -tzf "$package_path" > package-contents.txt
          grep -Fxq package/native/windows/termhelm-controller.ps1 package-contents.txt
          if grep -E '(^package/native/win32(-[^/]+)?/|\.exe$|(^|/)termhelm-controller\.cpp$|^package/native/windows/build\.ps1$|^package/scripts/build-windows-helper\.mjs$)' package-contents.txt; then
            echo 'Packed archive contains a legacy native Windows controller artifact.' >&2
            exit 1
          fi
